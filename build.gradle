plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.version
group = project.group
base {
	archivesName = project.archives_base_name
}

repositories {
	maven { url = 'https://maven.nucleoid.xyz' }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	include(implementation("xyz.nucleoid:server-translations-api:${project.server_translations_version}"))
	include(implementation('org.xerial:sqlite-jdbc:3.49.1.0'))
	// Server-side chest GUIs for vanilla clients (deposit staging + confirm).
	include(implementation("eu.pb4:sgui:${project.sgui_version}"))

	testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
	useJUnitPlatform()
}

fabricApi {
	configureTests {
		enableGameTests = true
		enableClientGameTests = false
		eula = true
	}
}

loom {
	runs {
		client {
			programArguments.addAll('--quickPlayMultiplayer', 'localhost:25565')
		}
		server {
			programArguments.addAll('nogui')
		}
	}
}

processResources {
	def version = project.version
	inputs.property 'version', version

	filesMatching('fabric.mod.json') {
		expand 'version': version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from('LICENSE') {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

/**
 * Writes pack/minecard-cards.zip (committed for jsDelivr / raw.githubusercontent HTTPS —
 * GitHub Release asset URLs 302 to short-lived S3 links and break vanilla clients).
 */
tasks.register('generateCardPack', JavaExec) {
	group = 'minecard'
	description = 'Generate pack/minecard-cards.zip for CDN hosting'
	dependsOn classes
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.spicypox.minecard.pack.CardResourcePack'
	args = ['pack/minecard-cards.zip']
}
